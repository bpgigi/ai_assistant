<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>
</head>
<body>

<h1>AI Assistant</h1>
<input id="conversationTitle" type="text" placeholder="新会话标题">
<button id="createConversationButton">新建会话</button>
<h2>会话列表</h2>
<div id="conversationlist"></div>

<input id="messageInput" type="text">
<button id="sendButton">发送</button>
<label>
    <input type="checkbox" id="ragToggle">
    启用知识库（RAG）
</label>
<div id="chat"></div>
<section>
    <h3>知识库管理</h3>
    <input type="file" id="knowledgeFile" accept=".md">
    <button id="uploadDocumentButton">上传并索引</button>
    <button id="updateDocumentButton">更新并索引</button>
    <button id="refreshDocumentsButton">
        刷新知识库
    </button>
    <div id="documentList"></div>
</section>

<script>
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const conversationList = document.getElementById("conversationlist");
    let currentConversationId = null;
    const conversationTitleInput = document.getElementById("conversationTitle");
    const createConversationButton = document.getElementById("createConversationButton")
    const ragToggle = document.getElementById("ragToggle");

    const documentList = document.getElementById(
        "documentList"
    );

    const refreshDocumentsButton =
        document.getElementById("refreshDocumentsButton");

    async function loadDocuments() {
        try {
            const response = await fetch(
                "http://127.0.0.1:8000/knowledge/documents"
            );

            if (!response.ok) {
                throw new Error("获取知识库失败");
            }

            const documents = await response.json();

            documentList.innerHTML = "";

            for (const doc of documents) {
                const item = document.createElement("div");

                const label = document.createElement("span");
                label.textContent =
                    `${doc.source} (${doc.chunk_count} chunks) `;

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "删除索引";

                deleteButton.onclick = async function () {
                    const confirmed = confirm(
                        `确定删除 ${doc.source} 的索引吗？\n原始 Markdown 文件会保留。`
                    );
            
                    if (!confirmed) {
                        return;
                    }

                    deleteButton.disabled = true;

                    try {
                        const response = await fetch(
                            "http://127.0.0.1:8000/knowledge/documents?source=" +
                            encodeURIComponent(doc.source),
                            {
                                method: "DELETE"
                            }
                        );

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.detail || "删除失败");
                        }

                        alert(`已删除 ${data.deleted_chunks} 个 Chunk`);
                        await loadDocuments();

                    } catch (error) {
                        alert(error.message);
                        deleteButton.disabled = false;
                    }
                };

                const deleteFileButton = document.createElement("button");
                deleteFileButton.textContent = "彻底删除";

                deleteFileButton.onclick = async function () {
                    if (!doc.source.startsWith("knowledge/")) {
                        alert("该文档不属于可管理的 knowledge 目录");
                        return;
                    }

                    const confirmed = confirm(
                        `确定彻底删除 ${doc.source} 吗？\n` +
                        "这将同时删除 Markdown 文件和向量索引，无法通过网页撤销。"
                    );

                    if (!confirmed) return;

                    deleteFileButton.disabled = true;

                    try {
                        const response = await fetch(
                            "http://127.0.0.1:8000/knowledge/documents/file?source=" +
                            encodeURIComponent(doc.source),
                            {method: "DELETE"}
                        );

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.detail || "删除失败");
                        }

                        alert("文件和索引已删除");
                        await loadDocuments();

                    } catch (error) {
                        alert(error.message);
                    } finally {
                        deleteFileButton.disabled = false;
                    }
                };

                item.appendChild(deleteFileButton);

                item.appendChild(label);
                item.appendChild(deleteButton);
                documentList.appendChild(item);
            }
        } catch (error) {
            alert(error.message);
        }
    }

    refreshDocumentsButton.onclick = loadDocuments;

    loadDocuments();

    const knowledgeFile = document.getElementById("knowledgeFile");
    const uploadDocumentButton = document.getElementById("uploadDocumentButton");

    uploadDocumentButton.onclick = async function () {
        const file = knowledgeFile.files[0];

        if (!file) {
            alert("请先选择 Markdown 文件");
            return;
        }

        if (!file.name.toLowerCase().endsWith(".md") ||
            file.size > 2 * 1024 * 1024) {
            alert("只支持不超过 2 MiB 的 Markdown 文件");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        uploadDocumentButton.disabled = true;

        try {
            const response = await fetch(
                "http://127.0.0.1:8000/knowledge/documents",
                {
                    method: "POST",
                    body: formData
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "上传失败");
            }

            alert(`上传成功，索引了 ${data.chunk_count} 个 Chunk`);

            knowledgeFile.value = "";
            await loadDocuments();

        } catch (error) {
            alert(error.message);
        } finally {
            uploadDocumentButton.disabled = false;
        }
    };

    const updateDocumentButton =
        document.getElementById("updateDocumentButton");

    updateDocumentButton.onclick = async function () {
        const file = knowledgeFile.files[0];

        if (!file) {
            alert("请先选择要更新的 Markdown 文件");
            return;
        }

        if (
            !file.name.toLowerCase().endsWith(".md") ||
            file.size > 2 * 1024 * 1024
        ) {
            alert("只支持不超过 2 MiB 的 Markdown 文件");
            return;
        }

        const confirmed = confirm(
            `确定更新 ${file.name} 吗？服务器上的同名文件及其索引将被替换。`
        );

        if (!confirmed) {
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        uploadDocumentButton.disabled = true;
        updateDocumentButton.disabled = true;

        try {
            const response = await fetch(
                "http://127.0.0.1:8000/knowledge/documents",
                {
                    method: "PUT",
                    body: formData
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "更新失败");
            }

            alert(`更新成功，索引了 ${data.chunk_count} 个 Chunk`);

            knowledgeFile.value = "";
            await loadDocuments();

        } catch (error) {
            alert(error.message);
        } finally {
            uploadDocumentButton.disabled = false;
            updateDocumentButton.disabled = false;
        }
    };

    function addSources(sources) {
        if (!sources || sources.length === 0) {
            return;
        }

        const sourceDiv = document.createElement("div");

        sourceDiv.textContent = "参考来源：";

        for (const source of sources) {
            const item = document.createElement("div");

            item.textContent =
                `${source.source}（距离：${source.distance.toFixed(4)}）`;

            sourceDiv.appendChild(item);
        }

        chat.appendChild(sourceDiv);
    }

    //新建会话
    createConversationButton.onclick = async function(){
        const title = conversationTitleInput.value.trim()
        if(!title){
            return;
        }
        try{
            const response = await fetch(
                "http://127.0.0.1:8000/conversations/",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        title:title
                    })
                }
            );
            if(!response.ok){
                const errorData = await response.json();
                throw new Error(errorData.detail);
            }
            const conversation = await response.json();
            conversationTitleInput.value = "";
            await loadConversations();
            currentConversationId = conversation.id;
            await loadMessages();
        }catch (error){
            console.error(error)
            alert("创建会话失败："+error.message);
        }
    };

    
    //显示一条信息
    function addMessage(role,content){
        const p = document.createElement("p");
        if (role === "user"){
            p.textContent = "你："+content;
        }else if (role === "assistant"){
            p.textContent = "AI："+content;
        }
        chat.appendChild(p);
    }

    //加载所有conversation
    async function loadConversations(){
        try{
            const response = await fetch(
            "http://127.0.0.1:8000/conversations/"
            );
            if(!response.ok){
                throw new Error(
                    "加载会话失败：" + response.status
                );
            }

            const conversations = await response.json();
            conversationList.innerHTML = "";
            //循环
            for (const conversation of conversations) {
                const button = document.createElement("button");
                button.textContent = conversation.title;

                button.onclick = function(){
                    currentConversationId = conversation.id;
                    loadMessages();
                };
                conversationList.appendChild(button);
                //删除按钮
                const deleteButton = document.createElement("button");
                deleteButton.textContent = "删除";
                deleteButton.onclick = function (){
                    deleteConversation(conversation.id);
                };
                conversationList.appendChild(deleteButton);
            }
        }catch (error){
            console.error(error);
        }
    }

    //加载当前conversation的历史消息
    async function loadMessages(){
        if(currentConversationId === null){
            return;
        }
        try {
            const response = await fetch(
                `http://127.0.0.1:8000/conversations/${currentConversationId}/messages`
            );
            if(!response.ok){
                const errorData = await response.json();
                throw new Error(errorData.detail);
            }

            const messages = await response.json();
            //切换conversation时先清空页面
            chat.innerHTML = "";
            for (const message of messages) {
                addMessage(message.role, message.content);

                if (message.role === "assistant" && message.sources?.length > 0) {
                    addSources(message.sources);
                }
            }

        }catch (error){
            console.error(error);

            addMessage(
                "assistant",
                "加载聊天记录失败：" + error.message
            );
        }
    }

    //删除
    async function deleteConversation(id) {
    try {
        const response = await fetch(
            `http://127.0.0.1:8000/conversations/${id}`,
            {
                method:"DELETE"
            }
        );

        // 这里判断 response.ok
        if(!response.ok){
            throw new Error("删除失败："+response.status);
        }

        // 删除成功后：
        // 1. 如果删的是当前会话，currentConversationId 设为 null
        if(id === currentConversationId) {
            currentConversationId = null;
           // 2. 清空 chat
            chat.innerHTML = "";
        }

        // 3. 重新加载会话列表
        await loadConversations();

    } catch (error) {
        console.error(error);
    }
}

    //发送信息
    sendButton.onclick = async function () {
        const message = input.value.trim();
        if(!message){
            return;
        }

        if(currentConversationId === null){
            alert("请先选择一个会话");
            return;
        }

        sendButton.disabled = true;

        try{
            addMessage("user",message);

            const response = await fetch(
                `http://127.0.0.1:8000/conversations/${currentConversationId}/messages`,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        content:message,
                        use_rag:ragToggle.checked
                    })
                }
            );


            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail);
            }

            const data = await response.json();

            addMessage("assistant",data.answer)
            addSources(data.sources);
            if (data.sources && data.sources.length > 0) {
                for (const source of data.sources) {
                    console.log(
                        "来源：", source.source,
                        "距离：", source.distance
                    );
                }
            }
            //发送后清空输入框
            input.value="";

        }catch (error){
            console.error(error);
            addMessage("assistant","请求失败:"+error.message);
        }finally {
            sendButton.disabled = false;
        }
    };

    //Enter发送
    input.addEventListener("keydown",function (event){
        if (event.key === "Enter"){
            sendButton.click();
        }
    });

    //页面打开时加载conversation
    loadConversations();
</script>
</body>
</html>
