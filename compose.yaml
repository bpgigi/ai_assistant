services:
  ai-assistant:
    image: ai-assistant:dev

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    volumes:
      # SQLite 数据库
      - ./assistant.db:/app/assistant.db

      # ChromaDB 向量索引
      - ./chroma_data:/app/chroma_data

      # Markdown 知识库
      - ./knowledge:/app/knowledge

      # 本地 Embedding 模型缓存
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro

    working_dir: /app

    init: true